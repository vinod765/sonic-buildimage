name: Check for binary artifacts

on:
  pull_request:
    branches:
      - 'master'
      - '202[2-9][0-9][0-9]'

permissions:
  contents: read

jobs:
  check-binary-artifacts:
    if: github.repository_owner == 'sonic-net'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch base branch
        run: |
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Check for binary artifacts
        run: |
          python3 scripts/check_binary_artifacts.py \
            --base "origin/${GITHUB_BASE_REF}" \
            --head HEAD
